<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b1422">
  <title>Página indisponível | Compass Rose Systems</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 25%,#1e3650 0,#0b1422 55%,#070c14 100%);color:#f1f5fa;padding:24px}
    main{width:min(100%,640px);text-align:center}
    .mark{display:inline-grid;place-items:center;width:76px;height:76px;border:1px solid #56718b;border-radius:22px;color:#c0d5e6;margin-bottom:30px;font-size:34px;font-weight:300}
    .eyebrow{letter-spacing:.24em;text-transform:uppercase;font-size:11px;color:#a6bfd1;font-weight:700}
    h1{font-size:clamp(35px,7vw,58px);line-height:1.12;letter-spacing:-.045em;margin:18px 0}
    p{color:#b3c3d3;font-size:17px;line-height:1.7;margin:0 auto;max-width:490px}
    hr{border:0;border-top:1px solid #30465b;margin:48px auto 28px;max-width:200px}
    footer{font-size:12px;letter-spacing:.09em;color:#8ea9bc}
  </style>
</head>
<body>
  <main role="main">
    <div class="mark" aria-hidden="true">✦</div>
    <div class="eyebrow">Compass Rose Systems</div>
    <h1>Página indisponível</h1>
    <p>O endereço solicitado não foi encontrado. Confira o link informado.</p>
    <hr>
    <footer>INFRAESTRUTURA DIGITAL · COMPASS ROSE SYSTEMS</footer>
  </main>
</body>
</html>
