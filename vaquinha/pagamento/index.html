<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirmando pagamento | Minha Campanha</title><style>body{font-family:system-ui;background:#F7F4EC;color:#245C4A;display:grid;place-items:center;min-height:100vh;margin:0}.card{background:white;border-radius:24px;max-width:530px;margin:18px;padding:35px;text-align:center;box-shadow:0 16px 60px #245C4A18}a{color:white;background:#245C4A;padding:13px 22px;border-radius:12px;display:inline-block;text-decoration:none;font-weight:700}p{line-height:1.7}</style></head><body><div class="card"><h1>Confirmando seu pagamento</h1><p id="status">Aguarde enquanto verificamos a confirmação diretamente com a InfinitePay.</p><a id="campaign" hidden>Ver minha campanha</a><p id="retry" hidden>Se você pagou recentemente, aguarde alguns instantes e atualize esta página.</p></div><script>
const q=new URLSearchParams(location.search);
async function check(){
const p=q.get('pedido')||q.get('order_nsu');if(!p){document.getElementById('status').textContent='Pedido não identificado.';return;}
const s=new URLSearchParams({action:'status',pedido:p,transaction_nsu:q.get('transaction_nsu')||'',slug:q.get('slug')||''});
try{const r=await fetch('/api/infinitepay/index.php?'+s);const j=await r.json();if(j.paid&&j.url){document.getElementById('status').textContent='Pagamento confirmado! Sua campanha está pronta.';const a=document.getElementById('campaign');a.href=j.url;a.hidden=false;}else{document.getElementById('status').textContent='Ainda não recebemos a confirmação do pagamento.';document.getElementById('retry').hidden=false;}}catch(e){document.getElementById('status').textContent='Não foi possível consultar o pagamento agora. Tente novamente.';document.getElementById('retry').hidden=false;}}
check();
</script></body></html>
